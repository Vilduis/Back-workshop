## =============================================================================
## AUTOTALLER  -  application.properties
## =============================================================================
##
## ESTRUCTURA
##   - Las propiedades que cambian entre entornos tienen DOS bloques:
##       ## --- DEV ---     (PostgreSQL local, secret hardcoded, etc.)
##       ## --- PROD ---    (Render + NeonDB, valores via variables de entorno)
##     Solo UNO debe estar descomentado a la vez. El otro va con '#' al inicio.
##
##   - Los SECRETOS reales nunca van aqui:
##       DEV  -> ./application-local.properties (gitignored, sobrescribe este)
##       PROD -> Variables de entorno configuradas en Render
##
## MODO ACTIVO ACTUAL:  PROD  (Render + NeonDB)
##   -> Para volver a DEV: invertir los comentarios en cada bloque marcado.
## =============================================================================


## -----------------------------------------------------------------------------
## OVERRIDES LOCALES (solo en dev, ignorado por git)
## -----------------------------------------------------------------------------
## Si existe ./application-local.properties, sus valores sobrescriben los de aqui.
spring.config.import=optional:file:./application-local.properties


## -----------------------------------------------------------------------------
## BASE DE DATOS (PostgreSQL)
## -----------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver

## --- DEV (PostgreSQL local) ---
#spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_db
#spring.datasource.username=postgres
#spring.datasource.password=Sandoval64

## --- PROD (Render + NeonDB via env vars) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


## -----------------------------------------------------------------------------
## JPA / HIBERNATE
## -----------------------------------------------------------------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

## --- DEV (loguea SQL en consola) ---
#spring.jpa.show-sql=true

## --- PROD (sin logging de SQL) ---
spring.jpa.show-sql=false


## -----------------------------------------------------------------------------
## SERVIDOR (mismo en dev y prod)
## -----------------------------------------------------------------------------
server.servlet.context-path=/api
server.tomcat.threads.max=200
server.tomcat.connection-timeout=5s
server.max-http-request-header-size=2MB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-post-size=2MB


## -----------------------------------------------------------------------------
## JWT
## -----------------------------------------------------------------------------

## --- DEV (secret hardcoded, expiracion 3h = 10800000 ms) ---
#jwt.secret=QVJRVUlURUNUVVJBX0FQTElDQUNJT05FU19XRUJfVVBDX0lOR0VOSUVSSUFfU0lTVEVNQVNfREVfSU5GT1JNQUNJT04K
#jwt.expiration=10800000

## --- PROD (valores via env vars en Render) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


## -----------------------------------------------------------------------------
## SWAGGER / SPRINGDOC (mismo en dev y prod)
## -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/docs-json


## -----------------------------------------------------------------------------
## EMAIL (Resend via SMTP)
## -----------------------------------------------------------------------------
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=autotaller@vilduis.com
app.mail.from-name=AutoTaller

## La API key de Resend NO se commitea:
##   DEV  -> definida en application-local.properties
##   PROD -> variable de entorno RESEND_API_KEY en Render
spring.mail.password=${RESEND_API_KEY:}


## -----------------------------------------------------------------------------
## FRONTEND (URL base para links en emails: reset password, etc.)
## -----------------------------------------------------------------------------

## --- DEV (Vite dev server) ---
#app.frontend.url=http://localhost:5173

## --- PROD (URL real del frontend, via env var en Render) ---
app.frontend.url=${APP_FRONTEND_URL}
